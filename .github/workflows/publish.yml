name: Publish to npm and MCP Registry
# Manually triggered — the daily collect workflow creates calendar-tagged DB
# releases (v2026.08.05), so tag/release triggers would misfire on those.
# Flow: bump locally with `npm version patch|minor|major` (syncs server.json and
# stamps the CHANGELOG.md [Unreleased] section — which must have notes), push
# with tags, then run this workflow.
on:
  workflow_dispatch:

permissions:
  contents: write # GitHub release creation
  id-token: write # npm trusted publishing + MCP Registry login (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1+
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Everything that can be checked must be checked BEFORE npm publish: publishing to npm
      # is irreversible, so a precondition that used to fail afterwards (the missing tag,
      # which --verify-tag caught only at the release step) left the package published, the
      # release absent and the registry step skipped — unrecoverable by re-running.
      - name: Preflight
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION does not exist on the remote. Push it first: git push origin v$VERSION"
            exit 1
          fi

          # Notes must extract before publishing too — an unstamped CHANGELOG is the other
          # way this used to fail after npm had already gone out.
          node scripts/extract-changelog.js "$VERSION" > release-notes.md
          test -s release-notes.md

          # A tag on an older commit is normal when re-running to finish a partial publish,
          # so this informs rather than blocks.
          TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v$VERSION" --jq '.object.sha')
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::warning::Tag v$VERSION points at $TAG_SHA, not this run's commit $GITHUB_SHA."
          fi

      # prepublishOnly syncs server.json and runs the full build. Each publish step below is
      # guarded so a run that failed partway can be re-dispatched to finish the rest.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "graph-atlas-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "graph-atlas-mcp@$VERSION is already on npm — skipping."
          else
            npm publish
          fi

      # Release notes come from CHANGELOG.md — `npm version` stamped this version's
      # section. --verify-tag insists the semver tag was pushed (per the flow above)
      # rather than silently tagging whatever main happens to be.
      - name: Create GitHub release with changelog notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping."
          else
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file release-notes.md
          fi

      # GitHub OIDC proves ownership of the io.github.darrenjrobinson/* namespace —
      # no stored tokens or secrets required.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      # Publishes server.json (version already synced by npm version / prepublishOnly).
      # The registry validates the npm package via its mcpName field.
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
