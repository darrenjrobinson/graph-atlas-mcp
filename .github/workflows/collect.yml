name: Collect Graph API Changes
on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # Optional — enables the embeddings step below when the secret is configured.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # $metadata is publicly accessible without authentication (verified against the live
      # endpoints) — no Entra app registration or client credentials required (PRD §9).
      # Must resolve the newest CALENDAR-TAGGED release explicitly: a bare `gh release
      # download` targets the "latest" release, which is a semver server release (v0.3.0)
      # whenever the npm publish lands after that day's data release. That download finds no
      # graph-atlas.db.gz, and starting fresh here is destructive rather than merely empty —
      # the diff reads snapshots/ from git, so changes are still detected and released, but
      # against a database with no history, permissions, roles, or embeddings.
      - name: Download the newest data-release DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}$"))][0].tagName // ""')
          if [ -z "$TAG" ]; then
            echo "No calendar-tagged data release exists yet — establishing the first baseline."
            exit 0
          fi
          echo "Restoring database from data release $TAG"
          # No `|| true` fallback: a failure here means an existing history could not be
          # restored, and continuing would publish a gutted database over it.
          gh release download "$TAG" --pattern 'graph-atlas.db.gz' --output graph-atlas.db.gz --clobber
          gunzip -f graph-atlas.db.gz

      - name: Collect and diff
        run: node --experimental-sqlite scripts/collect-and-diff.js

      # Incremental — only embeds change records that don't have an embedding yet, so the
      # released DB keeps semantic search current. Skipped when the OPENAI_API_KEY secret
      # isn't configured; continue-on-error so a transient OpenAI outage never blocks the
      # daily release (un-embedded records are picked up on the next run).
      - name: Generate embeddings for new changes
        if: env.OPENAI_API_KEY != ''
        continue-on-error: true
        run: node --experimental-sqlite scripts/generate-embeddings.js

      - name: Commit snapshot history
        run: |
          git config user.name "Microsoft Graph Atlas Bot"
          git config user.email "bot@graph-atlas.local"
          git add snapshots/
          git diff --staged --quiet || git commit -m "chore: snapshot $(date -u +%Y-%m-%d)"
          git push

      - name: Create release (if changes detected)
        run: node --experimental-sqlite scripts/create-release.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
