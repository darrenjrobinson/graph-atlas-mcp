version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The v2 MCP packages share one version and server/client pin core exactly, so they
      # must move together. This group comes first: a package joins the first group it matches.
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
